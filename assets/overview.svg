<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">UNDERFRAME project overview</title><desc id="desc">Private implementation, public execution evidence. 702 Python tests and 24 renderer tests passed in the October 10, 2026 snapshot. Current episode completed through narration and stopped at visual planning.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#172f37"/></linearGradient></defs><rect width="1280" height="640" rx="28" fill="url(#bg)"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="78" fill="#76e4ce" font-size="16" letter-spacing="4">A PROJECT BY HAKAN KORKMAZ</text><text x="60" y="166" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="-2">UNDERFRAME</text><text x="64" y="216" fill="#c2d1e1" font-size="27">From sourced ideas to illustrated video.</text><text x="64" y="252" fill="#c2d1e1" font-size="27">Designed to validate, preserve and recover.</text><rect x="64" y="300" width="1152" height="94" rx="15" fill="#203747" stroke="#36505c"/><text x="88" y="352" fill="#ffffff" font-size="16" font-weight="700">RESEARCH</text><text x="246" y="352" fill="#76e4ce" font-size="20">→</text><text x="278" y="352" fill="#ffffff" font-size="16" font-weight="700">WRITE + CHECK</text><text x="436" y="352" fill="#76e4ce" font-size="20">→</text><text x="468" y="352" fill="#ffffff" font-size="16" font-weight="700">NARRATE</text><text x="626" y="352" fill="#76e4ce" font-size="20">→</text><text x="658" y="352" fill="#ffffff" font-size="16" font-weight="700">ILLUSTRATE</text><text x="816" y="352" fill="#76e4ce" font-size="20">→</text><text x="848" y="352" fill="#ffffff" font-size="16" font-weight="700">PACKAGE</text><text x="1006" y="352" fill="#76e4ce" font-size="20">→</text><text x="1038" y="352" fill="#ffffff" font-size="16" font-weight="700">DELIVER</text><text x="64" y="458" fill="#ffffff" font-size="39" font-weight="700">702</text><text x="160" y="457" fill="#c2d1e1" font-size="19">Python tests passed</text><text x="456" y="458" fill="#ffffff" font-size="39" font-weight="700">24</text><text x="518" y="457" fill="#c2d1e1" font-size="19">renderer tests passed</text><text x="64" y="503" fill="#76e4ce" font-size="17">PRIVATE IMPLEMENTATION · PUBLIC EXECUTION EVIDENCE</text><line x1="64" y1="540" x2="1216" y2="540" stroke="#36505c"/><text x="64" y="582" fill="#aabecd" font-size="16">10 OCT 2026 SNAPSHOT · LOCAL OFFLINE VERIFICATION · NOT A LIVE STATUS DISPLAY</text></g></svg>